<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      const locationInfo = window.location;
      const pathSegments = locationInfo.pathname.split('/');
      const basePath = `${pathSegments.slice(0, 2).join('/')}/`;
      const appPath = `/${pathSegments.slice(2).join('/')}`;
      const redirectUrl = new URL(basePath, locationInfo.origin);

      redirectUrl.searchParams.set('p', appPath);
      if (locationInfo.search) {
        redirectUrl.searchParams.set('q', locationInfo.search.slice(1));
      }
      if (locationInfo.hash) {
        redirectUrl.searchParams.set('h', locationInfo.hash.slice(1));
      }

      locationInfo.replace(redirectUrl.toString());
    </script>
  </head>
  <body></body>
</html>
